<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <style>
        body {
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
            margin: 0 auto;
            padding: 40px 20px 80px;
            max-width: 900px;
            color: #222;
            line-height: 1.6;
        }
        h1 {
            font-size: 28px;
            margin-top: 30px;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
        }
        a {
            color: #2c5aa0;
            text-decoration: none;
        }
        .project-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .project-card {
            display: block;
            width: 260px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .project-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        .project-card .card-body {
            padding: 12px 14px;
        }
        .project-card h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: #222;
        }
        .project-card p {
            margin: 0;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>
    <h1>Welcome to My CS180 Portfolio!</h1>
    <p class="subtitle">Projects from CS180: Intro to Computer Vision and Computational Photography.</p>

    <div class="project-grid">
        <a class="project-card" href="./0/index.html">
            <div class="card-body">
                <h3>Project 0</h3>
                <p>Becoming Friends with Your Camera</p>
            </div>
        </a>

        <a class="project-card" href="./1/index.html">
            <div class="card-body">
                <h3>Project 1</h3>
                <p>Images of the Russian Empire</p>
            </div>
        </a>

        <a class="project-card" href="./2/index.html">
            <div class="card-body">
                <h3>Project 2</h3>
                <p>Fun with Filters and Frequencies!</p>
            </div>
        </a>
    </div>

</body>
</html>
